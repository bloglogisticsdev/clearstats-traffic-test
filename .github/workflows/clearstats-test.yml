
name: ClearStats Diagnostic Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Diagnose ClearStats
        run: |
          node <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();

            page.on('request', request => {
              if (request.url().includes('clearstats')) {
                console.log('REQUEST:', request.url());
              }
            });

            page.on('response', response => {
              if (response.url().includes('clearstats')) {
                console.log(
                  'RESPONSE:',
                  response.status(),
                  response.url()
                );
              }
            });

            page.on('requestfailed', request => {
              console.log(
                'FAILED:',
                request.url(),
                request.failure()?.errorText
              );
            });

            page.on('pageerror', error => {
              console.log('JS ERROR:', error.message);
            });

            const response = await page.goto(
              'https://www.bloglogistics.com/',
              { waitUntil: 'domcontentloaded' }
            );

            console.log('PAGE STATUS:', response.status());

            await page.waitForTimeout(8000);

            const scripts = await page.locator('script[src]')
              .evaluateAll(elements =>
                elements.map(el => el.src)
              );

            console.log(
              'CLEARSTATS SCRIPTS:',
              scripts.filter(url => url.includes('clearstats'))
            );

            const details = await page.evaluate(() => ({
              dnt: navigator.doNotTrack,
              webdriver: navigator.webdriver
            }));

            console.log('BROWSER DETAILS:', details);

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
