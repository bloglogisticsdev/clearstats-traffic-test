
name: ClearStats Multi-Page Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clearstats-test
  cancel-in-progress: false

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Browse BlogLogistics
        run: |
          node <<'JS'
          const { chromium } = require('playwright');

          const base = 'https://www.bloglogistics.com';

          const pages = [
            '/',
            '/website-design/',
            '/wordpress-hosting/',
            '/about-us/'
          ];

          const sessions = 5;
          const delay = ms =>
            new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            let loadedPages = 0;
            let acceptedEvents = 0;
            let blockedPages = 0;

            try {
              for (let s = 1; s <= sessions; s++) {
                console.log(`\nSESSION ${s}/${sessions}`);

                const context = await browser.newContext({
                  viewport: {
                    width: 1366,
                    height: 768
                  }
                });

                const page = await context.newPage();

                page.on('response', response => {
                  if (response.url().includes(
                    '/bloglogistics-clearstats/v1/collect'
                  )) {
                    console.log(
                      '  CLEARSTATS RESPONSE:',
                      response.status()
                    );

                    if (response.status() >= 200 &&
                        response.status() < 300) {
                      acceptedEvents++;
                    }
                  }
                });

                for (const path of pages) {
                  const url = base + path;

                  try {
                    const response = await page.goto(url, {
                      waitUntil: 'domcontentloaded',
                      timeout: 30000
                    });

                    const status = response?.status();

                    console.log(
                      '  PAGE:', path,
                      'HTTP:', status
                    );

                    if (status === 403 || status === 429) {
                      blockedPages++;
                      console.log(
                        '  SECURITY BLOCK, stopping test'
                      );
                      throw new Error(
                        `Access blocked with HTTP ${status}`
                      );
                    }

                    if (status >= 200 && status < 300) {
                      loadedPages++;
                    }

                    await page.waitForTimeout(3000);

                  } catch (error) {
                    console.error(
                      '  NAVIGATION ERROR:', error.message
                    );

                    if (blockedPages) {
                      throw error;
                    }
                  }
                }

                await context.close();

                if (s < sessions) {
                  await delay(2000);
                }
              }
            } finally {
              await browser.close();
            }

            console.log('\nTEST SUMMARY');
            console.log('Expected page visits:', sessions * pages.length);
            console.log('Successful page loads:', loadedPages);
            console.log('Successful collection HTTP responses:',
                        acceptedEvents);
            console.log('Blocked pages:', blockedPages);

            if (loadedPages !== sessions * pages.length) {
              process.exitCode = 1;
            }

            if (acceptedEvents === 0) {
              console.log(
                'No successful ClearStats events observed.'
              );
              process.exitCode = 1;
            }
          })().catch(error => {
            console.error('TEST FAILED:', error.message);
            process.exitCode = 1;
          });
          JS
